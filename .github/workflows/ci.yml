name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - name: Lint
        run: pnpm lint --diagnostic-level=error --max-diagnostics=none

      - name: Typecheck
        run: pnpm check-types

      - name: Build
        run: pnpm build

      - name: Resolve Playwright version
        run: echo "PLAYWRIGHT_VERSION=$(pnpm --filter @figit/dom-to-figma exec playwright --version | awk '{print $2}')" >> "$GITHUB_ENV"

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright browsers
        run: pnpm --filter @figit/dom-to-figma exec playwright install chromium --with-deps

      - name: Test
        run: pnpm test

  upstream-core-delta:
    name: Upstream core delta governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Enforce registered core deltas
        run: pnpm upstream-core-delta:check --report .artifacts/upstream-core-delta.json

      - name: Upload core delta report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-core-delta
          path: .artifacts/upstream-core-delta.json
          if-no-files-found: warn
          retention-days: 14

  stable-upstream-compatibility:
    name: Latest stable upstream compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Fetch reviewed stable tag
        run: |
          stable_ref="$(node -p "JSON.parse(require('fs').readFileSync('docs/upstream-core-delta.json', 'utf8')).targets.stable.ref")"
          git fetch --no-tags https://github.com/figitdesign/web-to-figma.git "refs/tags/${stable_ref}:refs/tags/${stable_ref}"

      - name: Verify pinned latest release and report delta
        run: pnpm upstream-core-delta:stable --verify-latest --report .artifacts/stable-upstream.json

      - name: Build adapter compatibility artifacts
        run: pnpm --filter @figit/composed-dom build && pnpm --filter @figit/browser-capture-adapter build

      - name: Test adapter against latest stable release
        run: pnpm upstream-adapter:stable

      - name: Upload stable upstream report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stable-upstream-compatibility
          path: .artifacts/stable-upstream.json
          if-no-files-found: warn
          retention-days: 14

  upstream-main-compatibility:
    name: Upstream main compatibility
    runs-on: ubuntu-latest
    continue-on-error: ${{ !startsWith(github.head_ref, 'sync/upstream-') }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Fetch upstream main read-only
        run: |
          git remote add upstream https://github.com/figitdesign/web-to-figma.git
          git fetch --no-tags upstream main

      - name: Verify reviewed upstream main snapshot
        run: pnpm upstream-core-delta:main --report .artifacts/upstream-main.json

      - name: Upload upstream main report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-main-compatibility
          path: .artifacts/upstream-main.json
          if-no-files-found: warn
          retention-days: 14

  parity:
    name: Tier-0 parity ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - name: Resolve Playwright version
        run: echo "PLAYWRIGHT_VERSION=$(pnpm --filter @figit/dom-to-figma exec playwright --version | awk '{print $2}')" >> "$GITHUB_ENV"

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright browsers
        run: pnpm --filter @figit/dom-to-figma exec playwright install chromium --with-deps

      # Renders the corpus, runs the tier-0 diff, and fails if any scene
      # regresses against internal/oracle-harness/baseline/scoreboard.json.
      # No secrets — safe on fork PRs.
      - name: Parity ratchet
        run: pnpm oracle:parity

      - name: Upload run artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parity-run
          path: oracle/runs/parity
          retention-days: 7
