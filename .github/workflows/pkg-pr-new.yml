name: Package Release Assurance

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pack:
    name: Inspect local package tarballs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Build
        run: pnpm build
      - name: Enforce release policy
        run: pnpm release:policy
      - name: Pack and run clean-consumer smoke test
        run: pnpm release:preflight --source-sha "${{ github.event.pull_request.head.sha }}"
      - name: Upload package manifest
        uses: actions/upload-artifact@v4
        with:
          name: package-release-manifest
          path: .artifacts/private-release/manifest.json
          if-no-files-found: error
          retention-days: 7
